<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Soporte IT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-auth">
    <main class="shell">
        <section class="panel auth-panel">
            <h1>Crear cuenta</h1>
            <p class="muted">Completá tus datos para registrarte.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {% if category == 'error' %}alert-error{% else %}alert-success{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="form-grid">
                <label for="usuario">Usuario</label>
                <input id="usuario" type="text" name="usuario" placeholder="Mínimo 3 caracteres" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" name="contrasena" placeholder="Mínimo 6 caracteres" required>

                <label for="confirmar">Confirmar contraseña</label>
                <input id="confirmar" type="password" name="confirmar" placeholder="Repetí la contraseña" required>

                <button class="btn btn-primary" type="submit">Registrarse</button>
            </form>

            <a class="link-inline" href="{{ url_for('login') }}">¿Ya tenés cuenta? Iniciá sesión</a>
        </section>
    </main>

    <script>
        (function () {
            const body = document.body;
            let rafId = null;
            let targetX = 0;
            let targetY = 0;

            function applyShift() {
                body.style.setProperty("--shift-x", `${targetX}px`);
                body.style.setProperty("--shift-y", `${targetY}px`);
                rafId = null;
            }

            function queueShift(clientX, clientY) {
                const offsetX = ((clientX / window.innerWidth) - 0.5) * 26;
                const offsetY = ((clientY / window.innerHeight) - 0.5) * 26;
                targetX = Math.max(-20, Math.min(20, offsetX));
                targetY = Math.max(-20, Math.min(20, offsetY));

                if (!rafId) {
                    rafId = window.requestAnimationFrame(applyShift);
                }
            }

            window.addEventListener("pointermove", (event) => {
                queueShift(event.clientX, event.clientY);
            }, { passive: true });

            window.addEventListener("touchmove", (event) => {
                if (event.touches && event.touches[0]) {
                    queueShift(event.touches[0].clientX, event.touches[0].clientY);
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
